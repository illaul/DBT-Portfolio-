version: 2

models:
  - name: stg_customers
    description: Cleaned customers — one row per customer, columns renamed to standard conventions.
    columns:
      - name: customer_id
        description: Primary key of the customer.
        data_tests: [unique, not_null]
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last initial (anonymised).

  - name: stg_orders
    description: Cleaned orders — one row per order with a normalised status.
    columns:
      - name: order_id
        description: Primary key of the order.
        data_tests: [unique, not_null]
      - name: customer_id
        description: Foreign key to stg_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order lifecycle status.
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    description: Cleaned payments — one row per payment, amount converted from cents to dollars.
    columns:
      - name: payment_id
        description: Primary key of the payment.
        data_tests: [unique, not_null]
      - name: order_id
        description: Foreign key to stg_orders.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_method
        description: How the payment was made.
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'bank_transfer', 'coupon', 'gift_card']
      - name: amount
        description: Payment amount in dollars.
